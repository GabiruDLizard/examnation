<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 150 100">
  <defs>
    <radialGradient id="r1" cx="45%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="r2" cx="45%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </radialGradient>
    <radialGradient id="r3" cx="45%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Back oval (smallest) -->
    <ellipse cx="32" cy="44" rx="22" ry="13"
             fill="url(#r1)" stroke="white" stroke-width="2"
             transform="rotate(-20, 32, 44)"/>

    <!-- Middle oval -->
    <ellipse cx="60" cy="38" rx="30" ry="17"
             fill="url(#r2)" stroke="white" stroke-width="2"
             transform="rotate(-20, 60, 38)"/>

    <!-- Front oval (largest) -->
    <ellipse cx="90" cy="32" rx="38" ry="21"
             fill="url(#r3)" stroke="white" stroke-width="2"
             transform="rotate(-20, 90, 32)"/>
  </g>
</svg>
