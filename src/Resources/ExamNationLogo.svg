<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon background circle -->
  <circle cx="30" cy="30" r="22" fill="url(#iconGradient)" filter="url(#softShadow)"/>

  <!-- E letterform -->
  <rect x="20" y="20" width="18" height="3"  rx="1.5" fill="white"/>
  <rect x="20" y="28" width="13" height="3"  rx="1.5" fill="white"/>
  <rect x="20" y="36" width="18" height="3"  rx="1.5" fill="white"/>
  <rect x="20" y="20" width="3"  height="19" rx="1.5" fill="white"/>

  <!-- Company name -->
  <text x="62" y="34" font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="700" fill="url(#textGradient)" letter-spacing="-0.02em">
    ExamNation
  </text>
</svg>
