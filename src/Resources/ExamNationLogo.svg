<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant rainbow gradient for the main icon -->
    <linearGradient id="funGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#45b7d1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#96ceb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
    
    <!-- Playful text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3436;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>

    <!-- Spark gradient -->
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdcb6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e17055;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for sparkle effect -->
    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bounce animation for the logo -->
    <animateTransform id="bounce" attributeName="transform" 
                      type="translate" values="0,0; 0,-2; 0,0" 
                      dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Fun background elements -->
  <circle cx="185" cy="15" r="3" fill="#ff7675" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="45" r="2" fill="#74b9ff" opacity="0.7">
    <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Logo Icon with fun elements -->
  <g transform="translate(15, 15)">
    <animateTransform attributeName="transform" type="translate" 
                      values="15,15; 15,13; 15,15" dur="2s" repeatCount="indefinite"/>
    
    <!-- Main circular background with rainbow gradient -->
    <circle cx="15" cy="15" r="14" fill="url(#funGradient)" filter="url(#sparkleGlow)"/>
    
    <!-- Stylized "E" with rounded, friendly design -->
    <!-- Top horizontal line of E -->
    <rect x="7" y="8" width="16" height="3" rx="1.5" fill="white" opacity="0.95"/>
    <!-- Middle horizontal line of E -->
    <rect x="7" y="13.5" width="12" height="3" rx="1.5" fill="white" opacity="0.95"/>
    <!-- Bottom horizontal line of E -->
    <rect x="7" y="19" width="16" height="3" rx="1.5" fill="white" opacity="0.95"/>
    <!-- Vertical line of E -->
    <rect x="7" y="8" width="3" height="14" rx="1.5" fill="white" opacity="0.95"/>
    
    <!-- Sparkle elements -->
    <path d="M 25 8 L 26.5 10.5 L 29 9 L 27.5 11.5 L 30 13 L 27.5 12.5 L 26.5 15 L 25.5 12.5 L 23 13 L 24.5 11.5 L 23 9 L 24.5 10.5 Z" 
          fill="url(#sparkGradient)" filter="url(#sparkleGlow)" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 26.5 11.5; 360 26.5 11.5" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Small bouncing dot -->
    <circle cx="8" cy="25" r="1.5" fill="#ff6b6b" opacity="0.8">
      <animate attributeName="cy" values="25;23;25" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Company Name with playful styling -->
  <text x="50" y="26" font-family="'Comic Sans MS', cursive, system-ui" 
        font-size="22" font-weight="700" fill="url(#textGradient)" letter-spacing="-0.01em">
    ExamNation
  </text>
  
  <!-- Fun tagline -->
  <text x="50" y="42" font-family="'Comic Sans MS', cursive, system-ui" 
        font-size="9" font-weight="600" fill="#fd79a8" letter-spacing="0.03em">
    🚀 LEARN • GROW • SUCCEED 🌟
  </text>
  
  <!-- Additional fun elements -->
  <circle cx="47" cy="18" r="1" fill="#00cec9" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>